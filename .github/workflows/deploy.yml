name: Deploy CarrierBookingStub to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install production dependencies
        run: npm ci --omit=dev

      # Removes local dev/runtime artefacts before packaging
      - name: Clean local artefacts
        run: |
          rm -rf output/ bible/sharepoint-sync/ bible/generation-log.json bible/sp-sync-status.json bible/report-state.json

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: as-carrierbookingstub
          package: .
          startup-command: node backend/server.js
